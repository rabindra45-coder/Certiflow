<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Keyline -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Certificate Scroll Badge Container -->
  <g filter="url(#shadow)" transform="translate(256, 240)">
    <!-- Main Gold Ribbon Tail Backing -->
    <path d="M-60,110 L-95,180 L-50,165 L-10,180 L-30,110 Z" fill="#b45309"/>
    <path d="M60,110 L95,180 L50,165 L10,180 L30,110 Z" fill="#b45309"/>
    <path d="M-55,110 L-90,175 L-48,160 L-10,175 L-28,110 Z" fill="url(#goldGrad)"/>
    <path d="M55,110 L90,175 L48,160 L10,175 L28,110 Z" fill="url(#goldGrad)"/>

    <!-- Certificate Document Frame -->
    <rect x="-140" y="-170" width="280" height="230" rx="16" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
    <rect x="-124" y="-154" width="248" height="198" rx="10" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8,4"/>

    <!-- Certificate Text Lines Representation -->
    <rect x="-80" y="-126" width="160" height="12" rx="6" fill="#312e81"/>
    <rect x="-100" y="-96" width="200" height="8" rx="4" fill="#64748b"/>
    <rect x="-70" y="-76" width="140" height="8" rx="4" fill="#eab308"/>
    <rect x="-90" y="-56" width="180" height="6" rx="3" fill="#94a3b8"/>
    <rect x="-60" y="-40" width="120" height="6" rx="3" fill="#94a3b8"/>

    <!-- Ornate Central Gold Seal Stamp -->
    <circle cx="0" cy="30" r="54" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="30" r="44" fill="none" stroke="#78350f" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M0,-10 L8,14 L32,14 L12,28 L19,52 L0,38 L-19,52 L-12,28 L-32,14 L-8,14 Z" fill="#ffffff" transform="translate(0, 10) scale(0.65)"/>
  </g>
</svg>
